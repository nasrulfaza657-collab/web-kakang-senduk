{% extends 'base.html' %}{% block title %}Edit Kontestan{% endblock %}{% block content %}<section class="page-head"><span class="eyebrow dark">ADMINISTRATOR</span><h1>Edit <em>kontestan.</em></h1></section><section class="admin-panel"><form method="post" enctype="multipart/form-data" class="form-grid"><label>Nomor peserta<input name="nomor_peserta" value="{{ c.nomor_peserta }}" required></label><label>Nama<input name="nama" value="{{ c.nama }}" required></label><label>Kategori<select name="kategori"><option {{ 'selected' if c.kategori=='Kakang' }}>Kakang</option><option {{ 'selected' if c.kategori=='Senduk' }}>Senduk</option></select></label><label>Asal instansi<input name="asal_instansi" value="{{ c.asal_instansi or '' }}"></label><label>Tempat lahir<input name="tempat_lahir" value="{{ c.tempat_lahir or '' }}"></label><label>Tanggal lahir<input type="date" name="tanggal_lahir" value="{{ c.tanggal_lahir or '' }}"></label><label>Ganti foto<input type="file" name="foto" accept="image/png,image/jpeg,image/webp">{% if c.foto %}<small>Foto saat ini: {{ c.foto }}</small>{% endif %}</label><label>Visi<textarea name="visi">{{ c.visi or '' }}</textarea></label><label>Misi<textarea name="misi">{{ c.misi or '' }}</textarea></label><label>Prestasi<textarea name="prestasi">{{ c.prestasi or '' }}</textarea></label><label class="span2">Deskripsi<textarea name="deskripsi">{{ c.deskripsi or '' }}</textarea></label><div class="span2"><button class="btn gold">Simpan perubahan</button> <a class="back" href="{{ url_for('admin_contestants') }}">Batal</a></div></form></section>{% endblock %}
